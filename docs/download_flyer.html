<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baixar Flyer — IED</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #FAF8F5;
    color: #2B2B2B;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    text-align: center;
  }
  h1 { font-size: 26px; margin-bottom: 8px; }
  p { color: #666; margin-bottom: 24px; }
  img {
    max-width: 320px;
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    margin-bottom: 28px;
  }
  a.btn {
    display: inline-block;
    background: #B08D57;
    color: #fff;
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 40px;
    font-weight: bold;
    font-size: 18px;
    box-shadow: 0 4px 14px rgba(176,141,87,0.4);
    margin-bottom: 14px;
  }
  a.btn:active { transform: scale(0.98); }
  a.alt {
    color: #8C6E41;
    font-size: 15px;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <h1>IED — Flyer de Divulgação</h1>
  <p>Toque no botão abaixo para baixar a imagem para o seu telemóvel ou computador.</p>
  <img src="flyer_ied.jpg" alt="Flyer IED">
  <a class="btn" href="flyer_ied.jpg" download="Flyer_IED.jpg">⬇ Baixar Flyer (JPG)</a>
  <br>
  <a class="alt" href="flyer_ied.png" download="Flyer_IED.png">Baixar em PNG (alta qualidade)</a>
</body>
</html>
