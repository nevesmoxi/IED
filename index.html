<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/IED/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Manual digital de Introdução ao Estudo do Direito Angolano, da autoria de Neves Moxi — fundamentos, conceitos e princípios essenciais do Direito. Leia online, sem necessidade de instalação pela loja de aplicações.">
  <meta name="theme-color" content="#0B1E3F">
  <meta name="color-scheme" content="light dark">

  <!-- Open Graph / partilha em redes sociais e WhatsApp -->
  <meta property="og:title" content="Introdução ao Estudo do Direito Angolano — Neves Moxi">
  <meta property="og:description" content="Manual digital de Direito Angolano. Aceda gratuitamente pelo navegador, sem necessidade de instalar pela Play Store.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Android / Chrome: permite instalação como app (Add to Home Screen) -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS Safari: meta tags & ícones para "Adicionar ao Ecrã Principal" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IED Reader">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Introdução ao Estudo do Direito Angolano — IED Reader</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
